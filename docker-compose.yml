services:
  historico-de-louvores:
    build: .
    image: historico-de-louvores:latest
    container_name: historico-de-louvores
    restart: unless-stopped
    ports:
      - "127.0.0.1:5201:5201"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5201"
      COOKIE_SECURE: "true"
      HOSTNAME: "0.0.0.0"
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5201/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
